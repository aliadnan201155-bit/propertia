<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            height: 550px;
        }
        .header {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 12px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .bot-message {
            background: #e8e8e8;
            align-self: flex-start;
        }
        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #5568d3; }
        .loading { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🤖 RoofrBot</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const API_URL = 'http://localhost:8000/api/chatbot';

        function addMessage(text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            addMessage('⏳ Searching...', false);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                // Remove "Searching..." message
                messagesDiv.removeChild(messagesDiv.lastChild);
                
                if (data.success) {
                    addMessage(data.reply, false);
                    if (data.results && data.results.length > 0) {
                        // Display each property separately
                        data.results.forEach(r => {
                            const propertyText = `${r.option}. ${r.title}\n💰 Rs. ${(r.price/1000000).toFixed(1)}M\n🛏️ ${r.rooms} Beds | ${r.type}`;
                            addMessage(propertyText, false);
                        });
                    }
                    // Show admin contact if no results
                    if (data.adminContact) {
                        setTimeout(() => {
                            const contactMsg = `📞 **Contact Our Team:**\n📧 ${data.adminContact.email}\n📱 ${data.adminContact.phone}\n\nWe're here to help! 😊`;
                            addMessage(contactMsg, false);
                        }, 500);
                    }
                } else {
                    addMessage('❌ Error: ' + (data.error || 'Unknown error'), false);
                }
            } catch (err) {
                messagesDiv.removeChild(messagesDiv.lastChild);
                addMessage('⚠️ Connection error: ' + err.message, false);
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Greeting on load
        window.addEventListener('load', () => {
            addMessage('👋 Assalamu Alaikum! I\'m RoofrBot, your friendly property assistant. Tell me what you\'re looking for and I\'ll help you find the perfect property! 🏠', false);
        });
    </script>
</body>
</html>
